<div class="cliente-shell">
  <aside class="cliente-sidebar">
    <div class="brand">
      <div class="brand-icon">💧</div>

      <div>
        <h1>JASS<br>Huacariz</h1>
        <p>Portal del cliente</p>
      </div>
    </div>

    <nav class="menu">
      <a routerLink="/cliente/inicio" routerLinkActive="active">
        <span>🏠</span>
        Inicio
      </a>

      <a routerLink="/cliente/mis-suministros" routerLinkActive="active">
        <span>🏘️</span>
        Mis suministros
      </a>

      <a routerLink="/cliente/mis-recibos" routerLinkActive="active">
        <span>🧾</span>
        Mis recibos
      </a>

      <a routerLink="/cliente/perfil" routerLinkActive="active">
        <span>👤</span>
        Perfil
      </a>

      <a routerLink="/cliente/contrasena" routerLinkActive="active">
        <span>🔐</span>
        Contraseña
      </a>
    </nav>

    <button type="button" class="logout" (click)="cerrarSesion()">
      ⏻ Cerrar sesión
    </button>
  </aside>

  <main class="cliente-main">
    <header class="topbar">
      <div>
        <h2>Sistema de Gestión de Agua</h2>
        <p>Consulta tus suministros, recibos, pagos y datos personales.</p>
      </div>

      <div class="user-box">
        <div class="user-text">
          <strong>{{ nombreUsuario }}</strong>
          <span>{{ codigoUsuario }}</span>
        </div>

        <div class="avatar">
          {{ inicial() }}
        </div>
      </div>
    </header>

    <section class="content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
