server:
  port: 8080

spring:
  application:
    name: jass-huacariz-api

  servlet:
    multipart:
      enabled: true
      max-file-size: 3MB
      max-request-size: 5MB

  datasource:
    url: jdbc:postgresql://localhost:5432/jass_huacariz_db
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: 12345678901234567890123456789012345678901234567890
  expiration: 86400000